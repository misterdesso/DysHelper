name: Release

on:
  release:
    types: [published]

# write access to attach built asset to the release
permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Package extension
        run: cd dist && zip -r ../dyshelper.zip . -x '.*'

      # attach dyshelper.zip to the release that triggered this run (--clobber to overwrite for re-runs)
      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dyshelper.zip --clobber
